  schemas:
    CloudEventEnvelope:
      type: object
      required:
      - specversion
      - id
      - source
      - type
      - subject
      - time
      - datacontenttype
      - dataschema
      - data
      properties:
        specversion:
          type: string
          const: '1.0'
        id:
          type: string
          format: uuid
        source:
          type: string
          const: /retailnetwork/vendor-connectivity
        type:
          type: string
        subject:
          type: string
          description: The aggregate root id.
        time:
          type: string
          format: date-time
        datacontenttype:
          type: string
          const: application/json
        dataschema:
          type: string
      description: Published envelope. Consumed envelopes have the same attributes with the producer's `source`.
    PoLine:
      type: object
      required:
      - lineNo
      - listingId
      - quantity
      properties:
        lineNo:
          type: integer
          minimum: 1
        listingId: &id001
          type: string
        quantity:
          type: integer
          minimum: 1
    RejectReason:
      type: string
      enum:
      - OUT_OF_STOCK
      - UNKNOWN_LISTING
      - CANNOT_MEET_SHIP_BY
      - DISCONTINUED
    SubmissionKind:
      type: string
      enum:
      - ACKNOWLEDGEMENT
      - INVENTORY
      - NODE_REGISTRATION
      - NODE_PROFILE
      - SHIPMENT_CONFIRMATION
      - INBOUND_RECEIPT
    VendorOnboardedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - vendorId
            - name
            - ackWindowMinutes
            properties:
              vendorId:
                type: string
              name:
                type: string
              ackWindowMinutes:
                type: integer
                minimum: 60
                maximum: 1440
    VendorSuspendedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - vendorId
            - suspendedAt
            properties:
              vendorId:
                type: string
              suspendedAt:
                type: string
                format: date-time
              reason:
                type: string
    VendorReinstatedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - vendorId
            - reinstatedAt
            properties:
              vendorId:
                type: string
              reinstatedAt:
                type: string
                format: date-time
    PurchaseOrderIssuedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - poNumber
            - vendorId
            - nodeId
            - assignmentId
            - releaseNo
            - requiredShipBy
            - ackBy
            - lines
            properties:
              poNumber:
                type: string
              vendorId:
                type: string
              nodeId:
                type: string
              assignmentId:
                type: string
              releaseNo:
                type: integer
                minimum: 1
              requiredShipBy:
                type: string
                format: date-time
              ackBy:
                type: string
                format: date-time
              lines:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/PoLine'
    PurchaseOrderAcceptedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - poNumber
            - assignmentId
            - releaseNo
            - nodeId
            - acceptedAt
            - transactionId
            properties:
              poNumber:
                type: string
              assignmentId:
                type: string
              releaseNo:
                type: integer
                minimum: 1
              nodeId:
                type: string
              acceptedAt:
                type: string
                format: date-time
              transactionId:
                type: string
    PurchaseOrderRejectedEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - poNumber
            - assignmentId
            - releaseNo
            - nodeId
            - reasonCode
            - rejectedAt
            properties:
              poNumber:
                type: string
              assignmentId:
                type: string
              releaseNo:
                type: integer
                minimum: 1
              nodeId:
                type: string
              reasonCode:
                $ref: '#/components/schemas/RejectReason'
              rejectedAt:
                type: string
                format: date-time
    PurchaseOrderExpiredEvent:
      allOf:
      - $ref: '#/components/schemas/CloudEventEnvelope'
      - type: object
        properties:
          data:
            type: object
            required:
            - poNumber
            - assignmentId
            - releaseNo
