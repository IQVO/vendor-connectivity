asyncapi: 3.0.0
info:
  title: vendor-connectivity Domain Events
  version: 1.0.0
  contact:
    name: vendor-connectivity maintainers
    url: https://github.com/IQVO/vendor-connectivity
    email: vendor-connectivity@iqvo.example.com
  license:
    name: UNLICENSED
  tags:
  - name: vendor-connectivity
    description: The vendor-connectivity bounded context (retail network, partner tier).
  - name: vendoraccount
    description: Events raised by the VendorAccount aggregate.
  - name: purchaseorder
    description: Events raised by the PurchaseOrder aggregate.
  - name: submission
    description: Events raised by the Submission aggregate.
  - name: inboundreceipt
    description: The InboundReceiptSubmitted event, raised when an inbound receipt is accepted.
  description: |
    Event catalog for the **vendor-connectivity** bounded context of the retail network (partner tier):
    the Open Host Service for vendors that operate fulfillment nodes. The Vendor API itself is `apis/openapi.yaml`;
    vendors never see these events, the in-organization contexts do.

    **Published.** Eleven types. Ten go to `retailnetwork.vendor-connectivity.events` and `PurchaseOrderCancelled` goes ONLY to
    `retailnetwork.vendor-connectivity.analytics` (the model marks it analytics only). Every event leaves through a
    **transactional outbox**: the aggregate row, the submission row and the already-encoded events are written in ONE database
    transaction and an always-on relay drains them to Kafka (at-least-once; the CloudEvents `id` is stored with the outbox row, so a retry
    republishes the same `id`). The types are catalogued in ADR 0004.

    **Consumed.** Thirteen types from four producers (ADR 0003, ADR 0005): seller-inbound `InboundShipmentLabelled`, `InboundShipmentShipped`, `InboundShipmentReceived`; offer-availability `CatalogItemPackagingDeclared`, `CatalogItemPackLevelRetired`; node-topology `NodeRegistered`, `NodeOperationalProfileDeclared`,
    `NodeActivated`, `NodeSuspended`, `NodeRetired`; offer-availability `ListingCreated`; order-sourcing `FulfillmentReleasedToNode`,
    `FulfillmentCancelled`. Each is deduplicated on the CloudEvents `id` in the `processed_events` inbox table, dispatched on the full
    `type`, decoded tolerantly (unknown fields are ignored) and dead-lettered to `<topic>.dlq` when it cannot be processed.
    The consumed `data` below lists only the fields this context relies on.

    **Envelope (mandatory).** CloudEvents 1.0, structured content mode, Kafka header `content-type: application/cloudevents+json; charset=UTF-8`.
    `specversion`, `id`, `source` (`/retailnetwork/vendor-connectivity`), `type`, `subject` (the aggregate root id: `vendorId`, `poNumber` or
    `transactionId`), `time`, `datacontenttype` (`application/json`) and `dataschema`
    (`urn:retailnetwork:vendor-connectivity:<stream>:<EventName>:v1`, stream `events` or `analytics`) are all required. Kafka key = the subject,
    so one purchase order's events stay ordered on one partition. Type = `com.retailnetwork.partner.vendor-connectivity.<entity>.<EventName>`
    with entity `vendoraccount`, `purchaseorder` or `submission`.

    **Conventions.** `data` is camelCase; timestamps are RFC 3339 UTC; optional fields are omitted when absent (never null); arrays are always
    present. No event carries a ship-to address, name or phone.
servers:
  production:
    host: '{brokers}'
    protocol: kafka
    description: Retail-network Kafka broker (host supplied by the deployment environment via KAFKA_BROKERS).
    variables:
      brokers:
        default: kafka.retail-network.internal:9092
defaultContentType: application/cloudevents+json
channels:
  vendorConnectivityEvents:
    address: retailnetwork.vendor-connectivity.events
    title: vendor-connectivity integration topic
    description: This service's integration topic, written by the outbox relay; key = subject. Every message carries the CloudEvents content-type header. Dispatch
      on the full `type`, ignore unknown types, dedupe on `id`.
    messages:
      VendorOnboarded:
        $ref: '#/components/messages/VendorOnboarded'
      VendorSuspended:
        $ref: '#/components/messages/VendorSuspended'
      VendorReinstated:
        $ref: '#/components/messages/VendorReinstated'
      PurchaseOrderIssued:
        $ref: '#/components/messages/PurchaseOrderIssued'
      PurchaseOrderAccepted:
        $ref: '#/components/messages/PurchaseOrderAccepted'
      PurchaseOrderRejected:
        $ref: '#/components/messages/PurchaseOrderRejected'
      PurchaseOrderExpired:
        $ref: '#/components/messages/PurchaseOrderExpired'
      VendorShipmentConfirmed:
        $ref: '#/components/messages/VendorShipmentConfirmed'
      SubmissionProcessed:
        $ref: '#/components/messages/SubmissionProcessed'
      InboundReceiptSubmitted:
        $ref: '#/components/messages/InboundReceiptSubmitted'
  vendorConnectivityAnalytics:
    address: retailnetwork.vendor-connectivity.analytics
    title: vendor-connectivity analytics topic
    description: Analytics-only events. No context consumes them.
    messages:
      PurchaseOrderCancelled:
        $ref: '#/components/messages/PurchaseOrderCancelled'
  nodeTopologyEvents:
    address: retailnetwork.node-topology.events
    title: node-topology integration topic
    description: The node-topology integration topic, consumed under the mandatory consumer group `VENDOR_CONNECTIVITY_CONSUMER_GROUP`.
    messages:
      NodeRegistered:
        $ref: '#/components/messages/NodeRegistered'
      NodeOperationalProfileDeclared:
        $ref: '#/components/messages/NodeOperationalProfileDeclared'
      NodeActivated:
        $ref: '#/components/messages/NodeActivated'
      NodeSuspended:
        $ref: '#/components/messages/NodeSuspended'
      NodeRetired:
        $ref: '#/components/messages/NodeRetired'
  offerAvailabilityEvents:
    address: retailnetwork.offer-availability.events
    title: offer-availability integration topic
    description: The offer-availability integration topic, consumed under the mandatory consumer group `VENDOR_CONNECTIVITY_CONSUMER_GROUP`.
    messages:
      ListingCreated:
        $ref: '#/components/messages/ListingCreated'
      CatalogItemPackagingDeclared:
        $ref: '#/components/messages/CatalogItemPackagingDeclared'
      CatalogItemPackLevelRetired:
        $ref: '#/components/messages/CatalogItemPackLevelRetired'
  sellerInboundEvents:
    address: retailnetwork.seller-inbound.events
    title: seller-inbound integration topic
    description: The seller-inbound integration topic, consumed under the mandatory consumer group `INBOUND_CONSUMER_GROUP`.
    messages:
      InboundShipmentLabelled:
        $ref: '#/components/messages/InboundShipmentLabelled'
      InboundShipmentShipped:
        $ref: '#/components/messages/InboundShipmentShipped'
      InboundShipmentReceived:
        $ref: '#/components/messages/InboundShipmentReceived'
  orderSourcingEvents:
    address: retailnetwork.order-sourcing.events
    title: order-sourcing integration topic
    description: The order-sourcing integration topic, consumed under the mandatory consumer group `VENDOR_CONNECTIVITY_CONSUMER_GROUP`.
    messages:
      FulfillmentReleasedToNode:
        $ref: '#/components/messages/FulfillmentReleasedToNode'
      FulfillmentCancelled:
        $ref: '#/components/messages/FulfillmentCancelled'
operations:
  publishVendorConnectivityEvents:
    action: send
    title: Publish vendor-connectivity integration events
    summary: Publish the ten integration events through the transactional outbox.
    description: The service sends every integration event of its three aggregates (VendorAccount, PurchaseOrder, Submission) and the InboundReceiptSubmitted fact to `retailnetwork.vendor-connectivity.events`.
      Consumers route on the full `type`.
    tags:
    - name: vendor-connectivity
    channel:
      $ref: '#/channels/vendorConnectivityEvents'
    messages:
    - $ref: '#/channels/vendorConnectivityEvents/messages/VendorOnboarded'
    - $ref: '#/channels/vendorConnectivityEvents/messages/VendorSuspended'
    - $ref: '#/channels/vendorConnectivityEvents/messages/VendorReinstated'
    - $ref: '#/channels/vendorConnectivityEvents/messages/PurchaseOrderIssued'
    - $ref: '#/channels/vendorConnectivityEvents/messages/PurchaseOrderAccepted'
    - $ref: '#/channels/vendorConnectivityEvents/messages/PurchaseOrderRejected'
    - $ref: '#/channels/vendorConnectivityEvents/messages/PurchaseOrderExpired'
    - $ref: '#/channels/vendorConnectivityEvents/messages/VendorShipmentConfirmed'
    - $ref: '#/channels/vendorConnectivityEvents/messages/SubmissionProcessed'
    - $ref: '#/channels/vendorConnectivityEvents/messages/InboundReceiptSubmitted'
  publishVendorConnectivityAnalytics:
    action: send
    title: Publish vendor-connectivity analytics events
    summary: Publish the analytics-only PurchaseOrderCancelled through the transactional outbox.
    description: PurchaseOrderCancelled goes ONLY to `retailnetwork.vendor-connectivity.analytics`; no context consumes it.
    tags:
    - name: purchaseorder
    channel:
      $ref: '#/channels/vendorConnectivityAnalytics'
    messages:
    - $ref: '#/channels/vendorConnectivityAnalytics/messages/PurchaseOrderCancelled'
  receiveNodeTopologyEvents:
    action: receive
    title: Receive node-topology events
    summary: Receive the node-topology events this context relies on.
    description: Consumes NodeRegistered, NodeOperationalProfileDeclared, NodeActivated, NodeSuspended and NodeRetired into the local VendorNodeView (Conformist).
      NodeOperationalProfileDeclared supplies the handling time of `ackBy` (G4).
    tags:
    - name: vendor-connectivity
    channel:
      $ref: '#/channels/nodeTopologyEvents'
    messages:
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeRegistered'
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeOperationalProfileDeclared'
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeActivated'
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeSuspended'
    - $ref: '#/channels/nodeTopologyEvents/messages/NodeRetired'
  receiveOfferAvailabilityEvents:
    action: receive
    title: Receive offer-availability events
    summary: Receive the offer-availability events this context relies on.
    description: Consumes ListingCreated into the local ListingView and CatalogItemPackagingDeclared / CatalogItemPackLevelRetired into the local CatalogPackagingView
      (Conformist). The listing consumer and the packaging consumer read the same topic under their own consumer groups.
    tags:
    - name: vendor-connectivity
    channel:
      $ref: '#/channels/offerAvailabilityEvents'
    messages:
    - $ref: '#/channels/offerAvailabilityEvents/messages/ListingCreated'
    - $ref: '#/channels/offerAvailabilityEvents/messages/CatalogItemPackagingDeclared'
    - $ref: '#/channels/offerAvailabilityEvents/messages/CatalogItemPackLevelRetired'
  receiveSellerInboundEvents:
    action: receive
    title: Receive seller-inbound events
    summary: Receive the seller-inbound shipment events this context relies on.
    description: Consumes InboundShipmentLabelled, InboundShipmentShipped and InboundShipmentReceived into the local InboundShipmentView (Conformist). Only a SHIPPED
      shipment with a manifest is offered to vendors.
    tags:
    - name: vendor-connectivity
    channel:
      $ref: '#/channels/sellerInboundEvents'
    messages:
    - $ref: '#/channels/sellerInboundEvents/messages/InboundShipmentLabelled'
    - $ref: '#/channels/sellerInboundEvents/messages/InboundShipmentShipped'
    - $ref: '#/channels/sellerInboundEvents/messages/InboundShipmentReceived'
  receiveOrderSourcingEvents:
    action: receive
    title: Receive order-sourcing events
    summary: Receive the order-sourcing events this context relies on.
    description: Consumes FulfillmentReleasedToNode (issues a purchase order for a VENDOR node) and FulfillmentCancelled (cancels the ISSUED purchase order of the
      open release) (Customer/Supplier).
    tags:
    - name: vendor-connectivity
    channel:
      $ref: '#/channels/orderSourcingEvents'
    messages:
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentReleasedToNode'
    - $ref: '#/channels/orderSourcingEvents/messages/FulfillmentCancelled'
components:
  messages:
    VendorOnboarded:
      name: VendorOnboarded
      title: VendorOnboarded
      summary: A vendor account was onboarded (ACTIVE).
      description: '`type` = `com.retailnetwork.partner.vendor-connectivity.vendoraccount.VendorOnboarded`; subject and key = `vendorId`; stream `events`. Raised
        by OnboardVendor. Consumers: node-performance.'
      contentType: application/cloudevents+json
      tags:
      - name: vendoraccount
      payload:
        $ref: '#/components/schemas/VendorOnboardedEvent'
      examples:
      - name: vendorOnboarded
        summary: A vendor account was onboarded (ACTIVE).
        payload:
          specversion: '1.0'
          id: 9b2f4c1e-6a7d-4e0b-8f31-2c5d7a9e1b44
          source: /retailnetwork/vendor-connectivity
          type: com.retailnetwork.partner.vendor-connectivity.vendoraccount.VendorOnboarded
          subject: V-WS
          time: '2026-10-22T13:05:41Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:vendor-connectivity:events:VendorOnboarded:v1
          data:
            vendorId: V-WS
            name: Warehouse Systems
            ackWindowMinutes: 240
    VendorSuspended:
      x-no-consumer-reason: "vendor-account lifecycle fact (G30); integration event, no consumer yet"
      name: VendorSuspended
      title: VendorSuspended
      summary: A vendor account was suspended; its writes are refused until reinstated (G30).
      description: '`type` = `com.retailnetwork.partner.vendor-connectivity.vendoraccount.VendorSuspended`; subject and key = `vendorId`; stream `events`. Raised
        by SuspendVendor. Consumers: none yet (integration event).'
      contentType: application/cloudevents+json
      tags:
      - name: vendoraccount
      payload:
        $ref: '#/components/schemas/VendorSuspendedEvent'
      examples:
      - name: vendorSuspended
        summary: A vendor account was suspended; its writes are refused until reinstated (G30).
        payload:
          specversion: '1.0'
          id: 9b2f4c1e-6a7d-4e0b-8f31-2c5d7a9e1b44
          source: /retailnetwork/vendor-connectivity
          type: com.retailnetwork.partner.vendor-connectivity.vendoraccount.VendorSuspended
          subject: V-WS
          time: '2026-10-22T13:05:41Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:vendor-connectivity:events:VendorSuspended:v1
          data:
            vendorId: V-WS
            suspendedAt: '2026-10-22T13:00:00Z'
            reason: contract review
    VendorReinstated:
      x-no-consumer-reason: "vendor-account lifecycle fact (G30); integration event, no consumer yet"
      name: VendorReinstated
      title: VendorReinstated
      summary: A suspended vendor account was reinstated (G30).
      description: '`type` = `com.retailnetwork.partner.vendor-connectivity.vendoraccount.VendorReinstated`; subject and key = `vendorId`; stream `events`. Raised
        by ReinstateVendor. Consumers: none yet (integration event).'
      contentType: application/cloudevents+json
      tags:
      - name: vendoraccount
      payload:
        $ref: '#/components/schemas/VendorReinstatedEvent'
      examples:
      - name: vendorReinstated
        summary: A suspended vendor account was reinstated (G30).
        payload:
          specversion: '1.0'
          id: 9b2f4c1e-6a7d-4e0b-8f31-2c5d7a9e1b44
          source: /retailnetwork/vendor-connectivity
          type: com.retailnetwork.partner.vendor-connectivity.vendoraccount.VendorReinstated
          subject: V-WS
          time: '2026-10-22T13:05:41Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:vendor-connectivity:events:VendorReinstated:v1
          data:
            vendorId: V-WS
            reinstatedAt: '2026-10-22T15:00:00Z'
    PurchaseOrderIssued:
      name: PurchaseOrderIssued
      title: PurchaseOrderIssued
      summary: A purchase order was issued to a vendor node.
      description: '`type` = `com.retailnetwork.partner.vendor-connectivity.purchaseorder.PurchaseOrderIssued`; subject and key = `poNumber`; stream `events`. Raised
        by IssuePurchaseOrder (policy IssueOnRelease). Consumers: node-performance.'
      contentType: application/cloudevents+json
      tags:
      - name: purchaseorder
      payload:
        $ref: '#/components/schemas/PurchaseOrderIssuedEvent'
      examples:
      - name: purchaseOrderIssued
        summary: A purchase order was issued to a vendor node.
        payload:
          specversion: '1.0'
          id: 9b2f4c1e-6a7d-4e0b-8f31-2c5d7a9e1b44
          source: /retailnetwork/vendor-connectivity
          type: com.retailnetwork.partner.vendor-connectivity.purchaseorder.PurchaseOrderIssued
          subject: PO-3b9f1c0a7d2e4a18
          time: '2026-10-22T13:05:41Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:vendor-connectivity:events:PurchaseOrderIssued:v1
          data:
            poNumber: PO-3b9f1c0a7d2e4a18
            vendorId: V-WS
            nodeId: node-0f3a91
            assignmentId: asg-41d2
            releaseNo: 1
            requiredShipBy: '2026-10-22T18:00:00Z'
            ackBy: '2026-10-22T16:00:00Z'
            lines:
            - lineNo: 1
              listingId: lst-77
              quantity: 2
    PurchaseOrderAccepted:
      name: PurchaseOrderAccepted
      title: PurchaseOrderAccepted
      summary: The vendor accepted the purchase order in full; the acknowledgement transaction succeeded.
      description: '`type` = `com.retailnetwork.partner.vendor-connectivity.purchaseorder.PurchaseOrderAccepted`; subject and key = `poNumber`; stream `events`. Raised
        by ProcessSubmission (ACCEPT, SUCCESS). Consumers: order-sourcing, node-performance.'
      contentType: application/cloudevents+json
      tags:
      - name: purchaseorder
      payload:
        $ref: '#/components/schemas/PurchaseOrderAcceptedEvent'
      examples:
      - name: purchaseOrderAccepted
        summary: The vendor accepted the purchase order in full; the acknowledgement transaction succeeded.
        payload:
          specversion: '1.0'
          id: 9b2f4c1e-6a7d-4e0b-8f31-2c5d7a9e1b44
          source: /retailnetwork/vendor-connectivity
          type: com.retailnetwork.partner.vendor-connectivity.purchaseorder.PurchaseOrderAccepted
          subject: PO-3b9f1c0a7d2e4a18
          time: '2026-10-22T13:05:41Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:vendor-connectivity:events:PurchaseOrderAccepted:v1
          data:
            poNumber: PO-3b9f1c0a7d2e4a18
            assignmentId: asg-41d2
            releaseNo: 1
            nodeId: node-0f3a91
            acceptedAt: '2026-10-22T13:05:41Z'
            transactionId: tx-9b2f4c1e
    PurchaseOrderRejected:
      name: PurchaseOrderRejected
      title: PurchaseOrderRejected
      summary: The vendor rejected the purchase order in full; the acknowledgement transaction succeeded.
      description: '`type` = `com.retailnetwork.partner.vendor-connectivity.purchaseorder.PurchaseOrderRejected`; subject and key = `poNumber`; stream `events`. Raised
        by ProcessSubmission (REJECT, SUCCESS). Consumers: order-sourcing, node-performance.'
      contentType: application/cloudevents+json
      tags:
      - name: purchaseorder
      payload:
        $ref: '#/components/schemas/PurchaseOrderRejectedEvent'
      examples:
      - name: purchaseOrderRejected
        summary: The vendor rejected the purchase order in full; the acknowledgement transaction succeeded.
        payload:
          specversion: '1.0'
          id: 9b2f4c1e-6a7d-4e0b-8f31-2c5d7a9e1b44
          source: /retailnetwork/vendor-connectivity
          type: com.retailnetwork.partner.vendor-connectivity.purchaseorder.PurchaseOrderRejected
          subject: PO-3b9f1c0a7d2e4a18
          time: '2026-10-22T13:05:41Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:vendor-connectivity:events:PurchaseOrderRejected:v1
          data:
            poNumber: PO-3b9f1c0a7d2e4a18
            assignmentId: asg-41d2
            releaseNo: 1
            nodeId: node-0f3a91
            reasonCode: OUT_OF_STOCK
            rejectedAt: '2026-10-22T13:05:41Z'
    PurchaseOrderExpired:
      name: PurchaseOrderExpired
      title: PurchaseOrderExpired
      summary: The purchase order was not acknowledged before ackBy.
      description: '`type` = `com.retailnetwork.partner.vendor-connectivity.purchaseorder.PurchaseOrderExpired`; subject and key = `poNumber`; stream `events`. Raised
        by ExpireUnacknowledgedOrders (policy ExpireUnacknowledged). Consumers: order-sourcing, node-performance.'
      contentType: application/cloudevents+json
      tags:
      - name: purchaseorder
      payload:
        $ref: '#/components/schemas/PurchaseOrderExpiredEvent'
      examples:
      - name: purchaseOrderExpired
        summary: The purchase order was not acknowledged before ackBy.
        payload:
          specversion: '1.0'
          id: 9b2f4c1e-6a7d-4e0b-8f31-2c5d7a9e1b44
          source: /retailnetwork/vendor-connectivity
          type: com.retailnetwork.partner.vendor-connectivity.purchaseorder.PurchaseOrderExpired
          subject: PO-3b9f1c0a7d2e4a18
          time: '2026-10-22T13:05:41Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:vendor-connectivity:events:PurchaseOrderExpired:v1
          data:
            poNumber: PO-3b9f1c0a7d2e4a18
            assignmentId: asg-41d2
            releaseNo: 1
            nodeId: node-0f3a91
            ackBy: '2026-10-22T16:00:00Z'
    PurchaseOrderCancelled:
      name: PurchaseOrderCancelled
      title: PurchaseOrderCancelled
      summary: An ISSUED purchase order was cancelled because order-sourcing cancelled the assignment. Analytics only.
      description: '`type` = `com.retailnetwork.partner.vendor-connectivity.purchaseorder.PurchaseOrderCancelled`; subject and key = `poNumber`; stream `analytics`.
        Raised by CancelPurchaseOrder (policy CancelOnSourcingCancel). Consumers: analytics only (no context consumer).'
      contentType: application/cloudevents+json
      tags:
      - name: purchaseorder
      payload:
        $ref: '#/components/schemas/PurchaseOrderCancelledEvent'
      examples:
      - name: purchaseOrderCancelled
        summary: An ISSUED purchase order was cancelled because order-sourcing cancelled the assignment. Analytics only.
        payload:
          specversion: '1.0'
          id: 9b2f4c1e-6a7d-4e0b-8f31-2c5d7a9e1b44
          source: /retailnetwork/vendor-connectivity
          type: com.retailnetwork.partner.vendor-connectivity.purchaseorder.PurchaseOrderCancelled
          subject: PO-3b9f1c0a7d2e4a18
          time: '2026-10-22T13:05:41Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:vendor-connectivity:analytics:PurchaseOrderCancelled:v1
          data:
            poNumber: PO-3b9f1c0a7d2e4a18
            assignmentId: asg-41d2
            reason: customer cancelled
    VendorShipmentConfirmed:
      name: VendorShipmentConfirmed
      title: VendorShipmentConfirmed
      summary: The vendor confirmed shipment; the confirmation transaction succeeded.
      description: '`type` = `com.retailnetwork.partner.vendor-connectivity.purchaseorder.VendorShipmentConfirmed`; subject and key = `poNumber`; stream `events`.
        Raised by ProcessSubmission (SHIPMENT_CONFIRMATION, SUCCESS). Consumers: order-sourcing, shipping-and-tracking, node-performance.'
      contentType: application/cloudevents+json
      tags:
      - name: purchaseorder
      payload:
        $ref: '#/components/schemas/VendorShipmentConfirmedEvent'
      examples:
      - name: vendorShipmentConfirmed
        summary: The vendor confirmed shipment; the confirmation transaction succeeded.
        payload:
          specversion: '1.0'
          id: 9b2f4c1e-6a7d-4e0b-8f31-2c5d7a9e1b44
          source: /retailnetwork/vendor-connectivity
          type: com.retailnetwork.partner.vendor-connectivity.purchaseorder.VendorShipmentConfirmed
          subject: PO-3b9f1c0a7d2e4a18
          time: '2026-10-22T13:05:41Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:vendor-connectivity:events:VendorShipmentConfirmed:v1
          data:
            poNumber: PO-3b9f1c0a7d2e4a18
            assignmentId: asg-41d2
            nodeId: node-0f3a91
            trackingNumbers:
            - BR123456789
            shippedAt: '2026-10-22T17:30:00Z'
            requiredShipBy: '2026-10-22T18:00:00Z'
    SubmissionProcessed:
      name: SubmissionProcessed
      title: SubmissionProcessed
      summary: An asynchronous vendor write was processed (SUCCESS or FAILURE).
      description: '`type` = `com.retailnetwork.partner.vendor-connectivity.submission.SubmissionProcessed`; subject and key = `transactionId`; stream `events`. Raised
        by ProcessSubmission. Consumers: node-performance.'
      contentType: application/cloudevents+json
      tags:
      - name: submission
      payload:
        $ref: '#/components/schemas/SubmissionProcessedEvent'
      examples:
      - name: submissionProcessed
        summary: An asynchronous vendor write was processed (SUCCESS or FAILURE).
        payload:
          specversion: '1.0'
          id: 9b2f4c1e-6a7d-4e0b-8f31-2c5d7a9e1b44
          source: /retailnetwork/vendor-connectivity
          type: com.retailnetwork.partner.vendor-connectivity.submission.SubmissionProcessed
          subject: tx-9b2f4c1e
          time: '2026-10-22T13:05:41Z'
          datacontenttype: application/json
          dataschema: urn:retailnetwork:vendor-connectivity:events:SubmissionProcessed:v1
          data:
