{{- if .Values.mcp.enabled }}
{{- include "vendor-connectivity.requireDatabase" . -}}
{{- include "vendor-connectivity.requireNeighbourUrls" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vendor-connectivity.mcpFullname" . }}
  labels:
    {{- include "vendor-connectivity.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  replicas: {{ .Values.mcp.replicaCount }}
  selector:
    matchLabels:
      {{- include "vendor-connectivity.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcp
  template:
    metadata:
      labels:
        {{- include "vendor-connectivity.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mcp
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vendor-connectivity.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: mcp
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "vendor-connectivity.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/mcp"]
          ports:
            - name: http
              containerPort: {{ .Values.mcp.service.targetPort }}
              protocol: TCP
          # Env contract verified against cmd/mcp/main.go: MCP_ADDR,
          # LOG_LEVEL, DATABASE_URL, (migration step only)
          # MIGRATIONS_DATABASE_URL, and the four neighbour URLs (the same
          # config.* values the api reads: the Service is shared and
          # get_node_scorecard relays from node-performance). cmd/mcp has no
          # auth env, runs no submission/expiry/retention loop, starts no
          # outbox relay, runs no local-copy consumer and never dials Kafka
          # (deliberately NO KAFKA_BROKERS, EVENT_PUBLISHER or consumer
          # group here, so the mcp pod never carries Kafka env at all).
          env:
            - name: MCP_ADDR
              value: {{ .Values.mcp.httpAddr | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.mcp.serviceVersion | default .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.mcp.environment | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-mcp" .Values.otel.serviceName | quote }}
            {{- end }}
            - name: NODE_TOPOLOGY_URL
              value: {{ .Values.config.nodeTopologyUrl | quote }}
            - name: OFFER_AVAILABILITY_URL
              value: {{ .Values.config.offerAvailabilityUrl | quote }}
            - name: SHIPPING_AND_TRACKING_URL
              value: {{ .Values.config.shippingAndTrackingUrl | quote }}
            - name: NODE_PERFORMANCE_URL
              value: {{ .Values.config.nodePerformanceUrl | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vendor-connectivity.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # cmd/mcp runs the idempotent embedded migrations on start (like
            # cmd/api), so it needs the same direct-connection split.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vendor-connectivity.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- range .Values.mcp.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          # GET /healthz is served by cmd/mcp, so the probes have a cheap target.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.mcp.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
