{{- if and .Values.a2a.enabled .Values.a2a.route.enabled -}}
{{- /*
A2A exposure through the shared Kong gateway (the same warehouse-gateway
parentRefs the api's httproute.yaml uses; per-app values never carry them).

Host contract: /api/a2a/<context> -> Service <context>-a2a:8093, prefix
rewritten to / so the Agent Card stays reachable at
/api/a2a/<context>/.well-known/agent-card.json and the JSON-RPC endpoint at
/api/a2a/<context>/ (healthz deliberately stays off the host -- it is a
Kubernetes probe concern, not a public endpoint).

NO auth plugin -- the endpoint is unauthenticated by fleet-wide decision
(revert 2026-09-11); the ClusterIP boundary is the access control.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "vendor-connectivity.a2aFullname" . }}
  labels:
    {{- include "vendor-connectivity.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  parentRefs:
    {{- range .Values.a2a.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.a2a.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: {{ include "vendor-connectivity.a2aFullname" . }}
          port: {{ .Values.a2a.service.port }}
{{- end }}
