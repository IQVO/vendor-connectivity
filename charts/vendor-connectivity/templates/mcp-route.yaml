{{- if and .Values.mcp.enabled .Values.mcp.route.enabled -}}
{{- /*
MCP exposure through the shared Kong gateway (the same warehouse-gateway
parentRefs the api's httproute.yaml uses; per-app values never carry them).

Host contract: /api/mcp/<context> -> Service <context>-mcp:8090, prefix
rewritten to /mcp (the SDK's canonical endpoint on every cmd/mcp in this
fleet; healthz deliberately stays off the host -- it is a Kubernetes probe
concern, not a public endpoint).

NO auth plugin -- the endpoint is unauthenticated by fleet-wide decision
(revert 2026-09-11); the ClusterIP boundary is the access control.
*/ -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "vendor-connectivity.mcpFullname" . }}
  labels:
    {{- include "vendor-connectivity.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcp
spec:
  parentRefs:
    {{- range .Values.mcp.route.parentRefs }}
    - name: {{ .name }}
      namespace: {{ .namespace }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.mcp.route.path }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /mcp
      backendRefs:
        - name: {{ include "vendor-connectivity.mcpFullname" . }}
          port: {{ .Values.mcp.service.port }}
{{- end }}
