{{- if .Values.a2a.enabled }}
{{- include "vendor-connectivity.requireDatabase" . -}}
{{- include "vendor-connectivity.requireNeighbourUrls" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vendor-connectivity.a2aFullname" . }}
  labels:
    {{- include "vendor-connectivity.labels" . | nindent 4 }}
    app.kubernetes.io/component: a2a
spec:
  replicas: {{ .Values.a2a.replicaCount }}
  selector:
    matchLabels:
      {{- include "vendor-connectivity.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: a2a
  template:
    metadata:
      labels:
        {{- include "vendor-connectivity.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: a2a
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "vendor-connectivity.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: a2a
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "vendor-connectivity.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/a2a"]
          ports:
            - name: http
              containerPort: {{ .Values.a2a.service.targetPort }}
              protocol: TCP
          # Env contract verified against cmd/a2a/main.go: A2A_ADDR,
          # A2A_AGENT_URL (mandatory, no default in the binary; the chart
          # defaults it to this release's in-cluster Service DNS and a2a.agentUrl
          # overrides it), LOG_LEVEL, DATABASE_URL, (migration step only)
          # MIGRATIONS_DATABASE_URL, and the four neighbour URLs (the same
          # config.* values the api reads: the Service is shared and
          # get_node_scorecard relays from node-performance). cmd/a2a has no
          # auth env, runs no submission/expiry/retention loop, starts no
          # outbox relay, runs no local-copy consumer and never dials Kafka
          # (deliberately NO KAFKA_BROKERS, EVENT_PUBLISHER or consumer
          # group here, so the a2a pod never carries Kafka env at all).
          env:
            - name: A2A_ADDR
              value: {{ .Values.a2a.httpAddr | quote }}
            - name: A2A_AGENT_URL
              value: {{ .Values.a2a.agentUrl | default (printf "http://%s.%s.svc.cluster.local:%v/" (include "vendor-connectivity.a2aFullname" .) .Release.Namespace .Values.a2a.service.port) | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: SERVICE_VERSION
              value: {{ .Values.a2a.serviceVersion | default .Values.image.tag | default .Chart.AppVersion | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.a2a.environment | quote }}
            {{- if .Values.otel.enabled }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.endpoint | quote }}
            - name: OTEL_SERVICE_NAME
              value: {{ printf "%s-a2a" .Values.otel.serviceName | quote }}
            {{- end }}
            - name: NODE_TOPOLOGY_URL
              value: {{ .Values.config.nodeTopologyUrl | quote }}
            - name: OFFER_AVAILABILITY_URL
              value: {{ .Values.config.offerAvailabilityUrl | quote }}
            - name: SHIPPING_AND_TRACKING_URL
              value: {{ .Values.config.shippingAndTrackingUrl | quote }}
            - name: NODE_PERFORMANCE_URL
              value: {{ .Values.config.nodePerformanceUrl | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vendor-connectivity.databaseSecretName" . }}
                  key: {{ .Values.database.existingSecretKey }}
            {{- if .Values.database.migrationsExistingSecretKey }}
            # cmd/a2a runs the idempotent embedded migrations on start (like
            # cmd/api), so it needs the same direct-connection split.
            - name: MIGRATIONS_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "vendor-connectivity.databaseSecretName" . }}
                  key: {{ .Values.database.migrationsExistingSecretKey }}
                  optional: true
            {{- end }}
            {{- range .Values.a2a.extraEnv }}
            - {{ toYaml . | nindent 14 | trim }}
            {{- end }}
          # GET /healthz is served by cmd/a2a, so the probes have a cheap target.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.a2a.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
