apiVersion: v1
kind: Service
metadata:
  name: {{ include "vendor-connectivity.fullname" . }}
  labels:
    {{- include "vendor-connectivity.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # component=api pins the Service to the api pods (tests/test_service_selectors.py).
  selector:
    {{- include "vendor-connectivity.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
